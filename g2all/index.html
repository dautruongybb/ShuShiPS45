<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO JAILBREAK PS4 - ShuShiPS</title>
<!-- Khai báo biến toàn cục msgs ngay từ đầu để chống lỗi ReferenceError -->
<script>
var msgs;
</script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #080b11;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .container {
        background-color: #0e1522;
        border: 1px solid #1a2536;
        border-radius: 12px;
        width: 90%;
        max-width: 580px;
        padding: 35px 25px 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    .header { text-align: center; margin-bottom: 28px; }
    .title {
        color: #0084ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    .subtitle {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .info-list { display: flex; flex-direction: column; gap: 12px; }
    .info-row {
        background-color: #121b2b;
        border: 1px solid #1c2b42;
        border-radius: 8px;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13.5px;
    }
    .label {
        color: #8da2bb;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }
    .value {
        color: #ffffff;
        font-weight: 700;
        text-align: right;
    }
    .status-ok { color: #0084ff !important; }
    .status-done { color: #30d158 !important; }
    .status-error { color: #ff3b30 !important; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">AUTO JAILBREAK PS4 - ShuShiPS</div>
        <div class="subtitle">HỖ TRỢ FW 5.05 - 13.52</div>
    </div>

    <div class="info-list">
        <div class="info-row">
            <span class="label">Firmware</span>
            <span id="fw-val" class="value">Đang kiểm tra...</span>
        </div>

        <div class="info-row">
            <span class="label">Tải trọng</span>
            <span class="value">GoldHEN v2.4b18.12</span>
        </div>

        <div class="info-row">
            <span class="label">Ngày cập nhật</span>
            <span class="value">27/09/2026</span>
        </div>

        <div class="info-row">
            <span class="label">Trạng thái</span>
            <!-- ID msgs bắt buộc để lapse.js và alert.js ghi đè nội dung -->
            <span id="msgs" class="value status-ok">Đang khởi tạo...</span>
        </div>
    </div>
</div>

<script>
// Gán đối tượng DOM vào cả biến msgs và window.msgs
msgs = document.getElementById("msgs");
window.msgs = msgs;

var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Không phải PS4";
var fwNum = parseFloat(fwVersion);

document.getElementById("fw-val").innerText = fwVersion;

// Theo dõi thay đổi nội dung để tự động đổi màu sắc hiển thị
var observer = new MutationObserver(function() {
    var txt = msgs.innerText.toLowerCase();
    if (txt.includes("fail") || txt.includes("error") || txt.includes("lỗi") || txt.includes("not supported")) {
        msgs.className = "value status-error";
    } else if (txt.includes("done") || txt.includes("successfully") || txt.includes("thành công") || txt.includes("loaded")) {
        msgs.className = "value status-done";
    } else {
        msgs.className = "value status-ok";
    }
});
observer.observe(msgs, { childList: true, characterData: true, subtree: true });

function onScriptError() {
    msgs.className = "value status-error";
    msgs.innerText = "Không tìm thấy tệp khai thác! Hãy xóa Cache và thử lại...";
}

if (!isPS4) {
    msgs.className = "value status-error";
    msgs.innerText = "Chỉ hỗ trợ máy PS4 FW 5.05 và 7.00 - 13.52";
} else {
    // Điều hướng lưu cache nếu máy chưa có
    if (window.applicationCache && window.applicationCache.status === 0) {
        if (fwNum === 5.05) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            msgs.className = "value status-error";
            msgs.innerText = "Firmware không được hỗ trợ: " + fwVersion;
        }
    } else {
        // Đã có cache -> Bắt đầu nạp script
        msgs.innerText = "Đang nạp GoldHEN cho FW " + fwVersion + "...";

        var script = document.createElement('script');
        script.onerror = onScriptError;

        if (fwNum === 5.05) {
            script.src = "505/ps4.js";
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            script.type = 'module';
            script.src = "700/alert.js";
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            script.type = 'module';
            script.src = "900/alert.js";
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            script.src = "css/main.js";
            script.onload = function () {
                setTimeout(function () {
                    if (typeof doJb === 'function') doJb();
                }, 500);
            };
        } else if (fwNum >= 11.50 && fwNum <= 12.02) {
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
        } else if (fwNum >= 12.50 && fwNum <= 13.52) {
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
        }
        document.head.appendChild(script);
    }
}
</script>
</body>
</html>
