<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO JAILBREAK PS4 - ShuShiPS</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background-color: #0b0e14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .card {
        background-color: #121824;
        border: 1px solid #1f293d;
        border-radius: 20px;
        width: 90%;
        max-width: 900px;
        height: 520px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 45px 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        text-align: center;
    }
    .header {
        width: 100%;
    }
    .title {
        color: #0084ff;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        text-transform: uppercase;
    }
    .subtitle {
        color: #7d8b99;
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 25px;
    }
    .divider {
        width: 85%;
        height: 1.5px;
        background: linear-gradient(90deg, transparent, #0056b3, transparent);
        margin: 0 auto;
    }
    .content-msg {
        color: #ff4d4f;
        font-size: 23px;
        font-weight: 500;
        padding: 0 20px;
    }
    .footer {
        color: #6c7a89;
        font-size: 15px;
        line-height: 1.6;
    }
    .footer .author {
        color: #8b99a8;
        font-size: 16px;
    }
</style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title">AUTO JAILBREAK PS4 - ShuShiPS</div>
        <div class="subtitle">Hỗ Trợ FW 7.00 - 13.00</div>
        <div class="divider"></div>
    </div>

    <div id="msgs" class="content-msg">Đang tải GoldHEN... Vui lòng đợi</div>

    <div class="footer">
        <div class="author">Designed by: ShuShiPS</div>
        <div>Special thanks to all scene developers</div>
    </div>
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    document.getElementById("msgs").innerHTML = "Không tìm thấy nội dung! - Vui lòng xóa dữ liệu duyệt web và cài lại Cache...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("msgs").innerHTML = "Chỉ dành cho PS4 sử dụng Firmware từ 7.00 đến 13.00";
    });
} else {
    if (window.applicationCache && window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("msgs").innerHTML = 'Firmware không được hỗ trợ: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    if (typeof doJb === 'function') doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
</body>
</html>
