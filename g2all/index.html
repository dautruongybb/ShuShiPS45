<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO JAILBREAK PS4 - SHUSHIPS</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background-color: #080b11;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }
    .container {
        background-color: #0e1522;
        border: 1px solid #1a2536;
        border-radius: 12px;
        width: 90%;
        max-width: 580px;
        padding: 35px 25px 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    .header {
        text-align: center;
        margin-bottom: 28px;
    }
    .title {
        color: #0084ff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
    }
    .subtitle {
        color: #64748b;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .info-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .info-row {
        background-color: #121b2b;
        border: 1px solid #1c2b42;
        border-radius: 8px;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13.5px;
    }
    .label {
        color: #8da2bb;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }
    .value {
        color: #ffffff;
        font-weight: 700;
        text-align: right;
    }
    .status-error {
        color: #ff3b30 !important;
    }
    .status-ok {
        color: #0084ff !important;
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">AUTO JAILBREAK PS4 - SHUSHIPS</div>
        <div class="subtitle">HỖ TRỢ FW 5.05 - 13.52</div>
    </div>

    <div class="info-list">
        <div class="info-row">
            <span class="label">Firmware</span>
            <span id="fw-val" class="value">Đang kiểm tra...</span>
        </div>

        <div class="info-row">
            <span class="label">Tải trọng</span>
            <span class="value">GoldHEN v2.4b18.12</span>
        </div>

        <div class="info-row">
            <span class="label">Ngày cập nhật</span>
            <span class="value">27/09/2026</span>
        </div>

        <div class="info-row">
            <span class="label">Trạng thái</span>
            <span id="status-val" class="value status-error">Chờ nạp...</span>
        </div>
    </div>
</div>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Không phải PS4";
var fwNum = parseFloat(fwVersion);

var fwValElem = document.getElementById("fw-val");
var statusElem = document.getElementById("status-val");

fwValElem.innerText = fwVersion;

function onScriptError() {
    statusElem.className = "value status-error";
    statusElem.innerText = "Không tìm thấy file khai thác! Hãy xóa Cache và thử lại...";
}

if (!isPS4) {
    statusElem.className = "value status-error";
    statusElem.innerText = "Chỉ hỗ trợ máy PS4 FW 5.05 và 7.00 - 13.52";
} else {
    // Kiểm tra và cài đặt cache offline nếu chưa lưu
    if (window.applicationCache && window.applicationCache.status === 0) {
        if (fwNum === 5.05) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            statusElem.className = "value status-error";
            statusElem.innerText = "Firmware không được hỗ trợ: " + fwVersion;
        }
    } else {
        // Thực thi Payload tương ứng trên PS4 khi đã có cache
        statusElem.className = "value status-ok";
        statusElem.innerText = "Đang nạp GoldHEN cho FW " + fwVersion + "... Vui lòng đợi";

        var script = document.createElement('script');
        script.onerror = onScriptError;

        if (fwNum === 5.05) {
            script.src = "505/ps4.js";
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            script.type = 'module';
            script.src = "700/alert.js";
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            script.type = 'module';
            script.src = "900/alert.js";
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            script.src = "css/main.js";
            script.onload = function () {
                setTimeout(function () {
                    if (typeof doJb === 'function') doJb();
                }, 500);
            };
        } else if (fwNum >= 11.50 && fwNum <= 12.02) {
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
        } else if (fwNum >= 12.50 && fwNum <= 13.52) {
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
        }
        document.head.appendChild(script);
    }
}
</script>
</body>
</html>
